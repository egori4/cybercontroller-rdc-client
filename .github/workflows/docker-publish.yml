name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag, for example 0.1.0
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Resolve Desktop Commander version
        id: rdc
        shell: bash
        run: |
          rdc_version="$(npm view @wonderwhy-er/desktop-commander version)"
          echo "version=$rdc_version" >> "$GITHUB_OUTPUT"
          echo "Resolved Desktop Commander $rdc_version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            DESKTOP_COMMANDER_VERSION=${{ steps.rdc.outputs.version }}
          tags: |
            egori4/rdc-client:${{ steps.version.outputs.version }}
            egori4/rdc-client:${{ steps.version.outputs.minor }}
            egori4/rdc-client:latest
          labels: |
            org.opencontainers.image.source=https://github.com/egori4/rdc_client
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.rdc-client.desktop-commander-version=${{ steps.rdc.outputs.version }}
